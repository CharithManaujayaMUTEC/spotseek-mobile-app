name: spotseeker_app
description: Copilot UI demo built from screenshots.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  pinput: ^4.0.0
  signature: ^5.4.1
  fl_chart: ^0.68.0
  mobile_scanner: ^7.1.3
  permission_handler: ^12.0.1
  flutter_svg: ^2.1.1
  excel: ^4.0.6
  path_provider: ^2.1.1
  path: ^1.8.3
  file_picker: ^8.1.2
  url_launcher: ^6.2.0
  device_info_plus: ^10.1.0
  image_picker: ^0.8.7+4
  flutter_image_compress: ^2.1.0
  intl: ^0.20.2

  # API & Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # JSON Serialization
  json_annotation: ^4.8.1

  # State Management (already have riverpod)
  riverpod_annotation: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons:
    ^0.14.4

    # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    # Explicitly list the mock data file so it's guaranteed to be packaged.
    - assets/mocks/events_data.json
    - assets/mocks/mock_invitations.json
    - assets/mocks/invoice_sample.json
    - assets/mocks/profile_mock.json
    # Keep the directory pattern so other assets are included too.
    - assets/

# Configuration for flutter_launcher_icons to generate app icons from
# assets/spotseeker_logo_app_icon.png for Android and iOS.
flutter_icons:
  android: true
  ios: true
  image_path: 'assets/spotseeker_logo_app_icon.png'
